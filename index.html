    <script>
      // 在GitHub Pages环境中预加载媒体文件映射表

        if (window.location.hostname.includes('github.io')) {
          fetch('/media-file-map.json')
            .then(response => response.json())
            .then(data => {
              window.MEDIA_FILE_MAP = data;
              console.log('媒体文件映射表预加载成功');
            })
            .catch(error => {
              console.warn('媒体文件映射表预加载失败:', error);
            });
        }
      })();
